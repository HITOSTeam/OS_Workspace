repos:
  - repo: local
    hooks:
      - id: text-format
        name: text format rules
        entry: python3 tools/check_format.py
        language: system
        types: [text]
        exclude: >
          (?x)^(
            bin/|
            img/|
            vendor/|
            testsuits-for-oskernel/|
            exampleOs/|
            ext4-fs-packer/extra/bin/|
            .*\.so$
          )

      - id: rustfmt
        name: rustfmt
        entry: rustfmt --check --edition 2024
        language: system
        files: \.rs$
        exclude: >
          (?x)^(
            vendor/|
            testsuits-for-oskernel/|
            exampleOs/
          )
