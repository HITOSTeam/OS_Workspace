[package]
name = "user"
version = "0.1.0"
edition = "2024"

[dependencies]
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
buddy_system_allocator = "0.6"
bitflags = "1.2.1"
xmas-elf = "0.7.0"

[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv = { git = "https://github.com/rcore-os/riscv", features = ["inline-asm"] }

[features]
submit = []
bash-shell = []

[[bin]]
name = "tlb_shootdown_smp_smoke"
path = "src/bin/smoke_archive/tlb_shootdown_smp_smoke.rs"

