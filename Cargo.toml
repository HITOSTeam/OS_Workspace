[workspace]
resolver = "3"
members = ["os", "user", "easy-fs", "easy-fs-fuse", "ext4-fs", "ext4-fs-packer"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
opt-level = 3           # LTP fork-heavy cases need optimized kernel hot paths.
overflow-checks = false # 关闭整数溢出检查
